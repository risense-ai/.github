<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Risense AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d17"/>
      <stop offset="1" stop-color="#0d2033"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e3a5f" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <circle cx="256" cy="256" r="250" fill="url(#glow)"/>

  <g fill="none">
    <circle cx="256" cy="256" r="196" stroke="#2dd4bf" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="154" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="112" stroke="#2dd4bf" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>

  <text x="256" y="336" text-anchor="middle" fill="url(#mark)"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="300" font-weight="700" letter-spacing="-8">R</text>

  <circle cx="392" cy="128" r="7" fill="#5eead4"/>
</svg>
