<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Risense AI — Respire">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d17"/>
      <stop offset="0.55" stop-color="#0a1524"/>
      <stop offset="1" stop-color="#0d1f30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="18" fill="none" stroke="#1e3a5f" stroke-opacity="0.8"/>

  <circle cx="1040" cy="160" r="230" fill="url(#glow)"/>
  <circle cx="120" cy="40" r="180" fill="url(#glow2)"/>

  <!-- breathing rings -->
  <g fill="none" stroke-linecap="round">
    <circle cx="1040" cy="160" r="142" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="1040" cy="160" r="112" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="1040" cy="160" r="82" stroke="#2dd4bf" stroke-opacity="0.26" stroke-width="1"/>
    <circle cx="1040" cy="160" r="52" stroke="#38bdf8" stroke-opacity="0.34" stroke-width="1"/>
    <circle cx="1040" cy="160" r="24" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>
  <circle cx="1040" cy="160" r="4" fill="#5eead4"/>

  <!-- memory waveform -->
  <path d="M 856 160 C 884 160 894 112 920 112 S 950 208 976 208 S 1008 92 1036 92 S 1068 228 1096 228 S 1128 120 1152 120 S 1180 160 1216 160"
        fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <g fill="#5eead4">
    <circle cx="856" cy="160" r="2.5" opacity="0.5"/>
    <circle cx="1036" cy="92" r="2.5" opacity="0.7"/>
    <circle cx="1152" cy="120" r="2.5" opacity="0.6"/>
    <circle cx="1216" cy="160" r="2.5" opacity="0.5"/>
  </g>

  <!-- left copy -->
  <text x="72" y="76" fill="#2dd4bf" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="5.5">RISENSE AI · OPEN SOURCE</text>

  <text x="70" y="170" fill="#f8fafc" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="15">RESPIRE</text>

  <rect x="72" y="192" width="104" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="72" y="238" fill="#dbe7f1" font-family="'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="24" letter-spacing="7">呼吸之间，记忆自持</text>

  <text x="72" y="270" fill="#7c93a8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" letter-spacing="0.4">Long-term memory infrastructure for humans and AI agents.</text>

  <text x="72" y="302" fill="#4fd1c5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="2">rsrs.rs</text>
  <text x="1208" y="302" fill="#526b82" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.6">GITHUB.COM/RISENSE-AI</text>
</svg>
